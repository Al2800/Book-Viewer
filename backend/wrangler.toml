name = "bookquotes-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

# KV Namespace for subscriptions and usage tracking
[[kv_namespaces]]
binding = "KV"
id = "95463b49b0b040a98a411104d2eaf9dd"
preview_id = "4f58e38410a74e30abe248160c5994d6"

# Secrets (set via `wrangler secret put`)
# - GEMINI_API_KEY
# - APPLE_TEAM_ID
# - JWT_SECRET
# - APPLE_BUNDLE_ID
# - APPLE_IAP_KEY_ID
# - APPLE_IAP_ISSUER_ID
# - APPLE_IAP_PRIVATE_KEY
# - APPLE_APP_ID (optional)

[env.production]
vars = { ENVIRONMENT = "production", ALLOW_AUTHENTICATED_EXTRACTION = "true" }
routes = ["api.bookquotes.uk/*"]

[[env.production.kv_namespaces]]
binding = "KV"
id = "11fab092c77043889c0c58967729df99"
