name = "bookquotes-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# Required for App Store notification JWS x5c chain verification (node:crypto X509Certificate)
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# KV Namespace for subscriptions, session revocations, and legacy usage migration.
[[kv_namespaces]]
binding = "KV"
id = "95463b49b0b040a98a411104d2eaf9dd"
preview_id = "4f58e38410a74e30abe248160c5994d6"

# Durable Object coordinator for atomic extraction-rate and usage decisions.
[[durable_objects.bindings]]
name = "EXTRACTION_LIMITER"
class_name = "ExtractionRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExtractionRateLimiter"]

# Secrets (set via `wrangler secret put`)
# - HF_API_TOKEN
# - HF_MODEL_ID (optional variable; must use an approved provider suffix, defaults to Qwen/Qwen2.5-VL-72B-Instruct:hf-inference)
# - APPLE_TEAM_ID
# - JWT_SECRET
# - APPLE_BUNDLE_ID
# - APPLE_IAP_KEY_ID
# - APPLE_IAP_ISSUER_ID
# - APPLE_IAP_PRIVATE_KEY
# - APPLE_APP_ID (optional)

[env.production]
# The authenticated TestFlight bypass expires automatically at the configured UTC instant.
# Remove both bypass variables after the temporary QA window closes.
# The model identifier is not secret; keeping it here prevents an opaque secret change from
# silently switching page images to a different provider.
vars = { ENVIRONMENT = "production", ALLOW_AUTHENTICATED_EXTRACTION = "true", AUTHENTICATED_EXTRACTION_BYPASS_UNTIL = "2026-07-19T00:00:00Z", HF_MODEL_ID = "Qwen/Qwen2.5-VL-72B-Instruct:hf-inference", APPLE_BUNDLE_ID = "com.acampbell.bookquotes" }
routes = ["api.bookquotes.uk/*"]

[[env.production.kv_namespaces]]
binding = "KV"
id = "11fab092c77043889c0c58967729df99"

[[env.production.durable_objects.bindings]]
name = "EXTRACTION_LIMITER"
class_name = "ExtractionRateLimiter"
