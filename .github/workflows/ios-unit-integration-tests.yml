name: iOS Unit + Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode Version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List Simulators (Debug)
        run: |
          xcrun simctl list devices available | sed -n '1,200p'

      - name: Run Tests
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -euxo pipefail

          DESTINATION="platform=iOS Simulator,name=iPhone 15,OS=latest"
          RESULT_BUNDLE="artifacts/xcresults/BookQuotesTests.xcresult"
          LOG_DIR="artifacts/logs"
          LOG_FILE="${LOG_DIR}/xcodebuild-tests.log"

          mkdir -p "$(dirname "$RESULT_BUNDLE")"
          mkdir -p "$LOG_DIR"

          xcodebuild test \
            -project BookQuotes.xcodeproj \
            -scheme BookQuotes \
            -destination "$DESTINATION" \
            -skip-testing:BookQuotesUITests \
            -resultBundlePath "$RESULT_BUNDLE" \
            -derivedDataPath artifacts/DerivedData \
            -enableCodeCoverage YES \
            2>&1 | tee "$LOG_FILE"

      - name: Generate Coverage HTML
        if: always()
        run: |
          set -euxo pipefail

          RESULT_BUNDLE="artifacts/xcresults/BookQuotesTests.xcresult"
          OUTDIR="artifacts/coverage/ci"
          THRESHOLDS="scripts/coverage_thresholds.json"

          if [[ ! -d "$RESULT_BUNDLE" ]]; then
            echo "No xcresult bundle found at $RESULT_BUNDLE; skipping coverage generation."
            exit 0
          fi

          mkdir -p "$OUTDIR"

          xcrun xccov view --report "$RESULT_BUNDLE" > "${OUTDIR}/summary.txt"
          xcrun xccov view --report --json "$RESULT_BUNDLE" > "${OUTDIR}/coverage_report.json"
          xcrun xccov view --archive --json "$RESULT_BUNDLE" > "${OUTDIR}/coverage_archive.json"

          python3 scripts/coverage_report.py \
            --report-json "${OUTDIR}/coverage_report.json" \
            --archive-json "${OUTDIR}/coverage_archive.json" \
            --lcov "${OUTDIR}/coverage.lcov" \
            --html "${OUTDIR}/coverage.html" \
            --thresholds "$THRESHOLDS"

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-BookQuotesTests-${{ github.run_id }}
          path: artifacts/xcresults/BookQuotesTests.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-BookQuotes-${{ github.run_id }}
          path: artifacts/coverage/ci
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios-tests-${{ github.run_id }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 14
